[package]
name = "remielle-desktop-agent"
version = "0.1.0"
description = "Remielle desktop companion agent"
authors = ["Calyndrae"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
# Tauri v2 builds the app as a library so mobile targets can link it.
name = "remielle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  # Required by `assetProtocol` in tauri.conf.json — the sprite's animation
  # files are loaded from the resource/app-data dirs via `asset:` URLs.
  "protocol-asset",
  # Required by `macOSPrivateApi` in tauri.conf.json — window transparency on
  # macOS. No effect on Windows.
  "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
# `log` was already a dependency and `log::warn!` was already being called in
# assets.rs, but nothing ever installed a logger, so every one of those records
# went nowhere. This is the backend that makes them real, and it writes to a
# file — which is what turns "it just failed" into something a user can send
# someone.
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
sys-locale = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time"] }

# The platform TLS stack on the desktop targets, rustls elsewhere.
#
# This used to be rustls everywhere ("one less thing that differs from Linux
# CI"), and that reasoning lost to a measurement: on the author's own network —
# a Karing/sing-box TUN of the kind DeepSeek's real users overwhelmingly sit
# behind — the tunnel fingerprints TLS ClientHellos, and rustls's handshake to
# api.deepseek.com was reset in ~74 ms while SecureTransport's sailed through
# to an HTTP 401 from the same binary in the same second. A chat app that
# cannot reach its default provider on the networks its users actually have is
# not made better by a tidier CI matrix. Browsers' TLS stacks are what these
# middleboxes are tuned to allow; the platform stack is the closest thing to
# that. No code selects a backend — reqwest defaults to whichever feature is
# compiled in, so each target gets the right one from here alone.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
# Windows Credential Manager, backed by DPAPI: the secret is bound to the
# user's Windows account and cannot be read from another account or machine.
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Reaching the NSWindow directly. Tauri's `set_always_on_top` maps to the
# floating window level, which is above ordinary windows and *below* a
# fullscreen Space — so she vanished the moment anything went fullscreen. Fixing
# that needs the window level and the collection behaviour, neither of which
# Tauri exposes. Already in the tree via tao; named here so the dependency is
# honest rather than borrowed.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication"] }

[features]
# This feature is used for production builds where `devUrl` points to the
# filesystem rather than a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
